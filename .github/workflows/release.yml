name: Release

# 推一个 vX.Y.Z 的 tag 即触发：云端并行构建双端产物并发布到同一个 GitHub Release：
#   - Windows 桌面：x64 + ARM64 的「安装包 + 便携包」、（可选）Authenticode 签名
#   - Android：APK + AAB（release 构建；配置 ANDROID_KEYSTORE_* secrets 后自动签名）
# 双端版本号同源：tag → scripts/sync-version.mjs 同步主版本（package.json / Cargo.toml /
# tauri.conf.json / AboutView），Android 侧版本由 tauri 在 android build 时从主版本动态生成，
# 天然保持一致。
# 也可在 Actions 页面手动 `workflow_dispatch` 触发（tag 必填）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动发布使用的版本 tag，例如 v2.2.0（手动触发时必填）'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true   # 打错 tag 重推时取消上一次构建，省 runner 分钟

permissions:
  contents: write            # softprops/action-gh-release 建 Release 需要

env:
  CARGO_TERM_COLOR: always

jobs:
  # ================= Windows 桌面构建 =================
  desktop:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      version: ${{ steps.rel.outputs.version }}
    # ⚠️ 血泪教训：`secrets` 上下文不能出现在 if: 里 —— GitHub 会直接判整个工作流文件非法
    # （Invalid workflow file: Unrecognized named-value: 'secrets'），表现为 0s 失败、连 job 都不启动。
    # 正确做法：先把 secret 落到 job 级 env（此处允许 secrets），再用 env.X != '' 做条件。
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # 桌面 job 不生成日志（发布 job 统一生成），此处保持完整历史以备后用

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # windows-latest 预装完整 VS（含 ARM64 工具链），交叉编译 aarch64 原生支持
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # 解析本次发布的 tag：tag 推送取 ref_name，手动触发取 inputs.tag。
      # 并把版本号自动同步到主版本 4 处（package.json / Cargo.toml / tauri.conf.json / AboutView）
      - name: Resolve release tag
        id: rel
        shell: pwsh
        env:
          # 用 github.event.inputs 而非 inputs 上下文：前者在任何事件下都可用，
          # push 触发时解析为空字符串，走 ref_name 分支（避免又踩上下文可用性的坑）
          IN_TAG: ${{ github.event.inputs.tag }}
        run: |
          $tag = if ($env:IN_TAG) { $env:IN_TAG } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d') {
            throw "需要一个形如 vX.Y.Z 的 tag，当前解析为 '$tag'。手动触发请在输入框填写 tag。"
          }
          $v = $tag -replace '^v',''
          "tag=$tag"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$v"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "发布版本：$v"
          node scripts/sync-version.mjs $v

      # 前端只构建一次（不依赖 tauri 的 beforeBuildCommand 是否生效），后续各构建步骤均用 beforeBuildCommand:null 复用
      - name: Build frontend
        run: npm run build

      # ---- 构建（先出便携包，再出安装包；前端已单独构建）----
      - name: Build x64 portable
        run: npm run tauri -- build --no-bundle --config '{"build":{"beforeBuildCommand":null}}'

      - name: Build ARM64 portable
        run: npm run tauri -- build --target aarch64-pc-windows-msvc --no-bundle --config '{"build":{"beforeBuildCommand":null}}'

      # ---- 代码签名（Authenticode）：有证书才签，无证书跳过（出未签名包）----
      # 需要的 secrets（可选）：
      #   WINDOWS_CERTIFICATE         : 证书 PFX 的 base64（去掉换行）
      #                                 生成：certutil -encode cert.pfx cert.b64 后取其内容（去换行）
      #   WINDOWS_CERTIFICATE_PASSWORD: PFX 密码
      # 建议用 EV 代码签名证书，SmartScreen 瞬时建立信誉；OV 需积累信誉。
      - name: Decode certificate
        if: env.WINDOWS_CERTIFICATE != ''
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\qm.pfx", $bytes)

      - name: Sign portable binaries
        if: env.WINDOWS_CERTIFICATE != ''
        run: |
          $st = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find "**\signtool.exe" | Select-Object -First 1
          & $st sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\qm.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD src-tauri/target/release/qm-updater.exe src-tauri/target/aarch64-pc-windows-msvc/release/qm-updater.exe

      - name: Build x64 installer
        run: npm run tauri -- build --config '{"build":{"beforeBuildCommand":null}}'

      - name: Build ARM64 installer
        run: npm run tauri -- build --target aarch64-pc-windows-msvc --config '{"build":{"beforeBuildCommand":null}}'

      - name: Sign installers
        if: env.WINDOWS_CERTIFICATE != ''
        run: |
          $st = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find "**\signtool.exe" | Select-Object -First 1
          $installers = Get-ChildItem src-tauri/target -Recurse -Filter *-setup.exe
          foreach ($i in $installers) {
            & $st sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\qm.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD $i.FullName
          }

      # 便携包改名，与发布资产命名一致（qm-updater-x64.exe / -arm64.exe）
      - name: Rename portable binaries
        run: |
          Copy-Item src-tauri/target/release/qm-updater.exe src-tauri/target/release/qm-updater-x64.exe
          Copy-Item src-tauri/target/aarch64-pc-windows-msvc/release/qm-updater.exe src-tauri/target/aarch64-pc-windows-msvc/release/qm-updater-arm64.exe

      # ⚠️ 安装包必须改成无空格 ASCII 名再上传。
      # Tauri 的 NSIS 产物是按 productName 拼的，即 `QM Updater_2.2.0_x64-setup.exe`
      # （含空格）；统一改成 README 里写的 qm-updater-<ver>-<arch>-setup.exe，
      # 与便携包命名一致，也避免文件名带空格在命令行/脚本里被误判。
      # 必须放在 Generate SHA256SUMS 之前，否则校验文件里还是旧名。
      - name: Rename installers
        run: |
          $v = "${{ steps.rel.outputs.version }}"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe |
            Rename-Item -NewName "qm-updater-$v-x64-setup.exe"
          Get-ChildItem src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe |
            Rename-Item -NewName "qm-updater-$v-arm64-setup.exe"

      - name: Generate SHA256SUMS
        run: |
          # ⚠️ 必须用 `+=` 逐个追加，不能写成
          #    @((Get-ChildItem a), (Get-ChildItem b), "x", "y")。
          # PowerShell 会把两个 Get-ChildItem 结果保留成**嵌套数组**，
          # foreach 拿到的 $f 是 Object[]，`$f -is [string]` 为 false，
          # 于是走 else 分支的 `$f.FullName` —— 把该目录下**所有**路径
          # 拼成单个字符串。实测两个安装包的校验行会输出成 `System.Object[]`，
          # 而便携包两行正常，文件"看起来有内容"却无法用 sha256sum -c 校验。
          $items = @()
          $items += Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          $items += Get-ChildItem src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          $items += 'src-tauri/target/release/qm-updater-x64.exe'
          $items += 'src-tauri/target/aarch64-pc-windows-msvc/release/qm-updater-arm64.exe'

          $lines = @()
          foreach ($f in $items) {
            $p = if ($f -is [string]) { $f } else { $f.FullName }
            if (Test-Path $p) {
              $h = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
              $lines += ('{0}  {1}' -f $h, [IO.Path]::GetFileName($p))
            }
          }
          $lines | Set-Content SHA256SUMS.txt

          # 断言：每一行都必须匹配 64 位十六进制 + 文件名，
          # 且总行数必须等于预期产物数（2 个安装包 + 2 个便携包）。
          if ($lines.Count -ne 4) { throw "期望 4 条校验和，实际 $($lines.Count) 条" }
          foreach ($l in $lines) {
            if ($l -notmatch '^[0-9a-f]{64}\s{2}\S+$') { throw "校验和格式非法: $l" }
          }
          Get-Content SHA256SUMS.txt

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/qm-updater-x64.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/qm-updater-arm64.exe
            SHA256SUMS.txt
          if-no-files-found: error

  # ================= Android 构建（APK + AAB） =================
  android:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      version: ${{ steps.rel.outputs.version }}
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'        # Android Gradle Plugin 兼容要求 17+

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Tauri Android 默认构建 4 个 ABI；NDK 交叉编译
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Resolve release tag
        id: rel
        env:
          IN_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$IN_TAG" ]; then tag="$IN_TAG"; else tag="${{ github.ref_name }}"; fi
          case "$tag" in v[0-9]*) ;; *) echo "需要一个形如 vX.Y.Z 的 tag，当前解析为 '$tag'。" >&2; exit 1;; esac
          v="${tag#v}"
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "发布版本：$v"
          node scripts/sync-version.mjs "$v"

      - name: Build frontend
        run: npm run build

      # Android SDK：ubuntu-latest 镜像自带（ANDROID_SDK_ROOT），增量补齐 tauri 所需
      #   - platform-tools
      #   - platforms;android-36（gen/android 模板 compileSdk=36）
      #   - ndk;29.0.13846066（tauri-cli 2.x 期望版本；ensure_ndk 找到它后自动设置 NDK_HOME）
      # sdkmanager 缺失时回退到官方 -latest 通道下载 cmdline-tools。
      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"   # tauri 的 ensure_sdk 认 ANDROID_HOME
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools/latest"
            curl -sS -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools/* "$SDK/cmdline-tools/latest/"
          fi
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "ndk;29.0.13846066" > /dev/null
          echo "sdkmanager: $(sdkmanager --version 2>&1 | tail -1)"
          ls "$SDK"

      # Android release 签名：配置 ANDROID_KEYSTORE_* secrets 后自动签名；
      # 未配置则产出 debug 签名产物（可安装测试，正式分发请配置密钥）。
      # build.gradle.kts 的 release signingConfig 读取同名环境变量（见 gen/android/app/build.gradle.kts）。
      - name: Decode Android keystore
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/qm-android.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/qm-android.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_ALIAS=$ANDROID_KEYSTORE_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_KEY_PASSWORD=$ANDROID_KEYSTORE_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "keystore decoded to $RUNNER_TEMP/qm-android.keystore"

      # 一次构建同时产出 APK 与 AAB（release）。前端已单独构建，beforeBuildCommand 置 null 复用。
      # 注意：--apk / --aab 是产物类型 flag；--target 只接受 ABI（aarch64 等，默认构建全部 ABI）。
      # 版本号：tauri 在构建时从同步后的主版本动态生成 tauri.properties（versionName/versionCode），
      # 与桌面端同源，天然保持一致。
      - name: Build Android (APK + AAB)
        run: |
          npm run tauri -- android build --apk --aab --config '{"build":{"beforeBuildCommand":null}}'

      - name: Collect Android artifacts
        run: |
          v="${{ steps.rel.outputs.version }}"
          APK=$(ls src-tauri/gen/android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p dist-android
          cp "$APK" "dist-android/qm-updater-$v-android.apk"
          cp src-tauri/gen/android/app/build/outputs/bundle/release/app-release.aab "dist-android/qm-updater-$v.aab"
          cd dist-android
          sha256sum qm-updater-*.aab qm-updater-*-android.apk > SHA256SUMS-android.txt
          ls -la
          cat SHA256SUMS-android.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist-android
          if-no-files-found: error

  # ================= 合并双端产物并发布 =================
  publish:
    runs-on: ubuntu-latest
    needs: [desktop, android]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # 更新日志需要完整历史

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-artifacts
          path: desktop-artifacts

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: android-artifacts

      # 双端校验和合并为一个 SHA256SUMS.txt（桌面 4 行 + Android 2 行 = 6 行）
      - name: Merge checksums
        run: |
          cat desktop-artifacts/SHA256SUMS.txt android-artifacts/SHA256SUMS-android.txt > SHA256SUMS.txt
          echo "==== merged SHA256SUMS.txt ===="
          cat SHA256SUMS.txt
          count=$(wc -l < SHA256SUMS.txt)
          if [ "$count" -ne 6 ]; then
            echo "期望 6 条校验和，实际 $count 条" >&2
            exit 1
          fi

      - name: Build release notes
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          range="${prev}..HEAD"
          [ -z "$prev" ] && range="HEAD"
          {
            echo "## What's Changed"
            git log --pretty=format:"- %s (%h)" "$range"
            echo
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.desktop.outputs.tag }}
          name: QM Updater ${{ needs.desktop.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            desktop-artifacts/*.exe
            android-artifacts/qm-updater-*.aab
            android-artifacts/qm-updater-*-android.apk
            SHA256SUMS.txt
          draft: false
          prerelease: false
