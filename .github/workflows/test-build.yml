name: Test Build

# 测试版构建发布（prerelease）：由 auto-tag.yml 在正式 tag 已存在（版本未 bump）时
# dispatch 触发。版本号动态获取：v<正式版本>-build.<CI 编号>（如 v2.1.0-build.87），
# 安卓 versionName=正式版本-build.编号、versionCode=CI 编号（run 号单调递增，保证
# 每次测试构建都被视为新版本）；桌面端由 --config 覆盖 package.version。
# 仅构建 x64 桌面便携包 + 安卓 release APK，不签名、不发正式 Release。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '测试版 tag，如 v2.1.0-build.87'
        required: true
        type: string

concurrency:
  group: test-build-${{ github.event.inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      version: ${{ steps.rel.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Resolve test version
        id: rel
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ($tag -notmatch '^v\d') { throw "需要一个形如 vX.Y.Z-build.N 的测试版 tag，当前为 '$tag'" }
          $v = $tag -replace '^v',''
          "tag=$tag"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "测试版版本：$v"

      - name: Build frontend
        run: npm run build

      # 测试版不捆绑安装包，只出 x64 便携包；version 由 --config 动态覆盖
      # ⚠️ Tauri v2 配置 schema 顶层直接是 version（没有 v1 的 package 对象），
      # 之前用 {"package":{...}} 被拒：Additional properties are not allowed ('package' was unexpected)
      - name: Build x64 portable
        run: npm run tauri -- build --no-bundle --config '{"version":"${{ steps.rel.outputs.version }}","build":{"beforeBuildCommand":null}}'

      - name: Rename portable
        run: |
          Copy-Item src-tauri/target/release/qm-updater.exe "qm-updater-${{ steps.rel.outputs.version }}-x64.exe"

      - name: Generate SHA256
        run: |
          $f = "qm-updater-${{ steps.rel.outputs.version }}-x64.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "$h  $f" | Set-Content SHA256SUMS.txt
          if ((Get-Content SHA256SUMS.txt) -notmatch '^[0-9a-f]{64}\s{2}\S+$') { throw "校验和格式非法" }
          Get-Content SHA256SUMS.txt

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: |
            qm-updater-${{ steps.rel.outputs.version }}-x64.exe
            SHA256SUMS.txt
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      version: ${{ steps.rel.outputs.version }}
    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      PROPERTIES: ${{ secrets.PROPERTIES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Resolve test version
        id: rel
        run: |
          tag="${{ github.event.inputs.tag }}"
          case "$tag" in v[0-9]*) ;; *) echo "需要一个形如 vX.Y.Z-build.N 的测试版 tag，当前为 '$tag'" >&2; exit 1;; esac
          v="${tag#v}"
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "测试版版本：$v"

      - name: Decode keystore
        if: env.KEYSTORE != ''
        run: echo "$KEYSTORE" | base64 --decode > android/app/ci.ks

      - name: Decode signing properties
        if: env.PROPERTIES != ''
        run: echo "$PROPERTIES" | base64 --decode > android/local.properties

      # 测试版版本号 = CI 编号：versionName=<正式版本>-build.<编号>，versionCode=<编号>
      - name: Build Android APK (release)
        env:
          BUILD_VERSION: ${{ steps.rel.outputs.version }}
        run: |
          v="${{ steps.rel.outputs.version }}"
          num="${v##*-build.}"
          echo "BUILD_NUMBER=$num" >> "$GITHUB_ENV"
          echo "versionName=$v, versionCode=$num (CI 编号)"
          cd android
          ./gradlew :app:assembleRelease

      - name: Collect Android artifact
        run: |
          v="${{ steps.rel.outputs.version }}"
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p dist-android
          cp "$APK" "dist-android/qm-updater-$v.apk"
          cd dist-android
          sha256sum qm-updater-*.apk > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist-android
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [desktop, android]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-artifacts
          path: desktop-artifacts

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: android-artifacts

      - name: Merge checksums
        run: |
          cat desktop-artifacts/SHA256SUMS.txt android-artifacts/SHA256SUMS-android.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [ "$(wc -l < SHA256SUMS.txt)" -ne 2 ]; then
            echo "期望 2 条校验和" >&2
            exit 1
          fi

      - name: Build release notes
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          range="${prev}..HEAD"
          [ -z "$prev" ] && range="HEAD"
          {
            echo "## Test build"
            echo "> 自动测试版：版本号为 CI 编号，非正式发布。"
            git log --pretty=format:"- %s (%h)" "$range"
            echo
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.desktop.outputs.tag }}
          name: QM Updater ${{ needs.desktop.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            desktop-artifacts/qm-updater-*.exe
            android-artifacts/qm-updater-*.apk
            SHA256SUMS.txt
          draft: false
          prerelease: true
